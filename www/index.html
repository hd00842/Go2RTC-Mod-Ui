<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>go2rtc</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0f1117;
  color: #e2e8f0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container {
  max-width: 600px;
  width: 100%;
  text-align: center;
}
h1 {
  font-size: 28px;
  margin-bottom: 8px;
  color: #e2e8f0;
}
h1 span { color: #3b82f6; }
.subtitle {
  color: #64748b;
  font-size: 14px;
  margin-bottom: 40px;
}
.main-link {
  display: block;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  color: white;
  text-decoration: none;
  padding: 24px 32px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 24px;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
}
.main-link:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(59, 130, 246, 0.4);
}
.main-link .icon { font-size: 24px; margin-right: 10px; }
.main-link .desc {
  display: block;
  font-size: 13px;
  font-weight: 400;
  color: rgba(255,255,255,0.7);
  margin-top: 6px;
}
.other-links {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.other-links a {
  display: block;
  background: #1a1d27;
  border: 1px solid #2d3243;
  color: #94a3b8;
  text-decoration: none;
  padding: 16px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
}
.other-links a:hover {
  background: #242836;
  border-color: #3b82f6;
  color: #e2e8f0;
}
.info {
  margin-top: 40px;
  color: #64748b;
  font-size: 12px;
}
</style>
</head>
<body>
<div class="container">
  <h1>go2rtc <span>NVR</span></h1>
  <p class="subtitle">Camera Streaming & Surveillance Dashboard</p>

  <a class="main-link" href="nvr.html">
    <span class="icon">🎥</span> NVR Dashboard
    <span class="desc">Multi-camera grid view, fullscreen, drag & drop</span>
  </a>

  <div class="other-links">
    <a href="add.html">➕ Add Stream</a>
    <a href="config.html">⚙️ Config</a>
    <a href="log.html">📋 Logs</a>
    <a href="index_original.html">📊 Streams List</a>
  </div>

  <div class="info" id="info"></div>
</div>
<script>
fetch('api').then(r => r.json()).then(d => {
  document.getElementById('info').textContent = 'v' + d.version;
});
</script>
</body>
</html>
