<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVR - go2rtc</title>
    <link rel="stylesheet" href="nvr.css">
</head>
<body>

<div id="nvr-app">
    <!-- ══ HEADER ══ -->
    <header id="nvr-header">
        <button class="icon-btn" id="sidebar-toggle" title="Toggle Sidebar (S)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
        </button>
        <div class="header-brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
                <circle cx="12" cy="13" r="4"/>
            </svg>
            go2rtc <span style="color:var(--accent);font-weight:400;">NVR</span>
        </div>

        <div class="header-stats">
            <div class="stat-badge stat-online">
                <span class="stat-dot online"></span>
                <span class="stat-count">0</span> Online
            </div>
            <div class="stat-badge stat-offline">
                <span class="stat-dot offline"></span>
                <span class="stat-count">0</span> Offline
            </div>
        </div>

        <div class="header-actions">
            <div class="layout-group">
                <button class="layout-btn" data-layout="1" title="1 Camera">1×1</button>
                <button class="layout-btn" data-layout="4" title="4 Cameras">2×2</button>
                <button class="layout-btn" data-layout="6" title="6 Cameras">3×2</button>
                <button class="layout-btn" data-layout="9" title="9 Cameras">3×3</button>
                <button class="layout-btn" data-layout="12" title="12 Cameras">4×3</button>
                <button class="layout-btn" data-layout="16" title="16 Cameras">4×4</button>
            </div>
            <button class="icon-btn" id="logout-btn" title="Logout">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
                        <button class="icon-btn" id="fullscreen-btn" title="Fullscreen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
                </svg>
            </button>
            <a class="icon-btn" href="index.html" title="go2rtc Main" style="text-decoration:none;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
                </svg>
            </a>
        </div>
    </header>

    <!-- ══ MAIN ══ -->
    <div id="nvr-main">
        <!-- Sidebar -->
        <aside id="nvr-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">
                    Cameras
                    <span id="camera-count">0 total</span>
                </div>
                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="search-input" placeholder="Search cameras...">
                </div>
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all">All</button>
                    <button class="filter-tab" data-filter="online">Online</button>
                    <button class="filter-tab" data-filter="offline">Offline</button>
                </div>
            </div>
            <div class="camera-list" id="camera-list">
                <!-- Camera items rendered by JS -->
            </div>
        </aside>

        <!-- Grid -->
        <main id="grid-container" class="grid-4">
            <!-- Tiles rendered by JS -->
        </main>
    </div>

    <!-- ══ STATUS BAR ══ -->
    <footer id="status-bar">
        <div class="status-item">
            <kbd>1</kbd><kbd>4</kbd><kbd>6</kbd><kbd>9</kbd><kbd>0</kbd> Layout
        </div>
        <div class="status-item">
            <kbd>F</kbd> Fullscreen
        </div>
        <div class="status-item">
            <kbd>S</kbd> Sidebar
        </div>
        <div class="status-item">
            <kbd>R</kbd> Reconnect
        </div>
        <div class="status-item">
            <kbd>ESC</kbd> Close
        </div>
        <div class="status-item" style="margin-left:auto;" id="status-clock">
            --:--:--
        </div>
    </footer>
</div>

<!-- ══ FULLSCREEN OVERLAY ══ -->
<div class="fullscreen-overlay" id="fullscreen-overlay"></div>

<!-- ══ CONTEXT MENU ══ -->
<div class="context-menu" id="context-menu"></div>

<!-- ══ TOASTS ══ -->
<div class="toast-container" id="toast-container"></div>

<!-- Load scripts -->
<script src="nvr.js"></script>
<script>
    // Status bar clock
    setInterval(() => {
        const el = document.getElementById('status-clock');
        if (el) el.textContent = new Date().toLocaleString();
    }, 1000);
</script>

<script>
document.getElementById('logout-btn').addEventListener('click', async () => {
  await fetch('api/logout', { method: 'POST' });
  location.href = 'index.html';
});
</script>
</body>
</html>
